name: Knowledge integrity
on:
  push:
    branches: [furbish]
    paths: ['assets/css/site.css', 'content/knowledge/**', 'knowledge/**', 'scripts/**', 'tests/**', '.github/workflows/knowledge-check.yml']
  pull_request:
    paths: ['assets/css/site.css', 'content/knowledge/**', 'knowledge/**', 'scripts/**', 'tests/**', '.github/workflows/knowledge-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --check knowledge/assets/app.js
      - run: python3 scripts/knowledge.py validate
      - run: python3 scripts/knowledge.py build
      - name: DOM interaction checks
        run: python3 scripts/knowledge_dom_check.py
      - name: Generated pages must match source
        run: |
          git diff --exit-code -- knowledge
          test -z "$(git ls-files --others --exclude-standard knowledge)"
