name: Ideas integrity
on:
  push:
    branches: [furbish]
    paths: ['content/ideas/**', 'ideas/**', 'docs/ideas/examples/**', 'scripts/**', 'tests/**', '.github/workflows/ideas-check.yml']
  pull_request:
    paths: ['content/ideas/**', 'ideas/**', 'docs/ideas/examples/**', 'scripts/**', 'tests/**', '.github/workflows/ideas-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --check ideas/assets/app.js
      - run: python3 scripts/ideas.py validate
      - run: python3 scripts/ideas.py build
      - name: DOM interaction checks
        run: python3 scripts/ideas_dom_check.py
      - name: Generated Ideas must match source
        run: |
          git diff --exit-code -- ideas
          test -z "$(git ls-files --others --exclude-standard ideas)"
